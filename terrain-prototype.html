<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chukar terrain pipeline prototype</title>
    <style>
      :root {
        color: #f5eddb;
        background: #8299a4;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }

      .prototype-card {
        position: fixed;
        top: 20px;
        left: 20px;
        width: min(360px, calc(100vw - 40px));
        padding: 15px 17px;
        border: 1px solid rgb(245 237 219 / 28%);
        border-radius: 3px;
        background: linear-gradient(145deg, rgb(28 35 34 / 88%), rgb(43 47 42 / 74%));
        box-shadow: 0 15px 50px rgb(12 17 17 / 28%);
        backdrop-filter: blur(10px);
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #d4b371;
        font: 650 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 { margin: 0 0 5px; font: 500 25px/1.05 Georgia, serif; }
      p { margin: 0; color: rgb(245 237 219 / 72%); font-size: 12px; line-height: 1.45; }
      .stats { margin-top: 10px; color: rgb(245 237 219 / 90%); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      .hint {
        position: fixed;
        right: 20px;
        bottom: 18px;
        padding: 7px 10px;
        border-radius: 2px;
        color: rgb(245 237 219 / 72%);
        background: rgb(25 30 29 / 60%);
        font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="terrain-prototype"></canvas>
    <section class="prototype-card">
      <p class="eyebrow">Throwaway pipeline test</p>
      <h1>Chukar vertical slice</h1>
      <p>Authored in Blender, exported as one GLB, rendered unchanged in Three.js.</p>
      <p class="stats" id="terrain-stats">Loading terrain…</p>
    </section>
    <p class="hint">DRAG TO ORBIT · SCROLL TO ZOOM · RIGHT-DRAG TO PAN</p>
    <script type="module" src="/src/three/terrainPrototype.ts"></script>
  </body>
</html>
