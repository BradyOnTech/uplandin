<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu art studio · actual game renders</title>
<style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#283c32;color:#ece5d6;font:14px system-ui}header{padding:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,a{color:inherit;background:#3d5141;border:1px solid #97a080;border-radius:5px;min-height:44px;padding:10px;cursor:pointer}iframe{width:1280px;height:720px;border:0;display:block}#model{width:900px;height:600px;background:#d6d3c5}#preview{width:640px;max-width:100%;display:block}#status{padding:12px}#save{display:inline-block;margin:12px}</style>
<header><strong>Menu art studio</strong><button data-area="quail-fields">Quail Fields</button><button data-area="pheasant-coverts">Cattail Coverts</button><button data-area="chukar-ridge">Chukar Ridge</button><button data-area="sharptail-prairie">Sharptail Prairie</button><button data-dog="gsp">GSP</button><button data-dog="english-setter">Setter</button><button data-gun="remington-870">Pump</button><button data-gun="semi-auto">A5</button><button data-gun="side-by-side">Venus</button><button data-gun="over-under">686</button><button id="export">Render artwork</button></header>
<p id="status">Select an asset.</p><a id="save" download="menu-art.webp" hidden>Save artwork</a><img id="preview" alt="Rendered menu artwork" hidden><iframe id="world" title="World preview" hidden></iframe><canvas id="model" hidden></canvas>
<script>window.addEventListener("error",e=>document.querySelector("#status").textContent=e.message);window.addEventListener("unhandledrejection",e=>document.querySelector("#status").textContent=String(e.reason));</script><script type="module" src="./menu-art-studio.ts"></script></html>
