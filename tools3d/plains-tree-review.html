<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plains trees · review</title>
<style>html,body{margin:0;height:100%;background:#9fb3bd;overflow:hidden;font:13px system-ui;color:#1e2420}canvas{display:block;width:100%;height:100%}#bar{position:fixed;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid #6a7466;background:#e8e2cc;cursor:pointer}button[aria-pressed=true]{background:#39422f;color:#eee7d5}</style>
<div id="bar"></div><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { buildPlainsTree } from '../src/three/assets/plainsTree.ts';
import { plainsFoliageMaterial, plainsWoodMaterial } from '../src/three/assets/plainsTreeMaterials.ts';
// Each species, four seeds, full and distant detail, under the farm's October light.
const canvas = document.querySelector('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb3bd); scene.fog = new THREE.Fog(0x9fb3bd, 120, 420);
scene.add(new THREE.HemisphereLight(0xcfdde6, 0x6e6246, 1.6));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.6); sun.position.set(-40, 60, 30); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, far: 200 }); sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0xb6a684 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(50, 1, .1, 1000); camera.position.set(0, 9, 62);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, 7, 0);
const wood = plainsWoodMaterial(), foliage = plainsFoliageMaterial();
const heights = { cottonwood: 19, ash: 11, elm: 12, boxelder: 8 };
let group;
function show(detail) {
  if (group) { scene.remove(group); group.traverse(o => o.geometry?.dispose()); }
  group = new THREE.Group(); let triangles = 0;
  ['cottonwood', 'ash', 'elm', 'boxelder'].forEach((species, row) => {
    for (let i = 0; i < 4; i++) {
      const tree = buildPlainsTree(species, 1000 + i * 37 + row * 911, detail); triangles += tree.triangles;
      for (const [geometry, material] of [[tree.wood, wood], [tree.foliage, foliage]]) {
        const mesh = new THREE.Mesh(geometry, material); mesh.castShadow = mesh.receiveShadow = true;
        mesh.scale.setScalar(heights[species]); mesh.position.set((i - 1.5) * 24, 0, -row * 26); group.add(mesh);
      }
    }
  });
  scene.add(group); document.title = `Plains trees · ${triangles.toLocaleString()} triangles`;
  window.__treeTriangles = triangles;
}
const bar = document.querySelector('#bar');
for (const detail of ['full', 'distant']) { const b = document.createElement('button'); b.textContent = detail; b.onclick = () => { show(detail); [...bar.children].forEach(c => c.setAttribute('aria-pressed', String(c === b))); }; bar.append(b); }
show('full'); bar.firstChild.setAttribute('aria-pressed', 'true');
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(t => { foliage.userData.time && (foliage.userData.time.value = t / 1000); controls.update(); renderer.render(scene, camera); window.__treesReady = true; });
</script></html>
