<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:," />
    <title>Uplandin — Frame PoC (composition vs assets)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2316; }
      canvas { display: block; width: 100%; height: 100%; }
      #poc-panel {
        position: fixed; z-index: 2; top: 12px; left: 12px;
        padding: 10px 12px; border-radius: 8px; max-width: 240px;
        color: #f4efe3; background: rgba(16,21,14,.85);
        border: 1px solid rgba(244,239,227,.25);
        font: 12px/1.5 system-ui, sans-serif;
      }
      #poc-panel h1 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; color: #ffd78a; }
      #poc-panel .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
      #poc-panel button {
        padding: 5px 10px; border-radius: 5px; cursor: pointer;
        border: 1px solid #d9b25f; background: #ffd78a; color: #1e2316;
        font: 600 12px system-ui, sans-serif;
      }
      #poc-panel button.ghost { background: transparent; color: #f4efe3; border-color: rgba(244,239,227,.4); }
      #poc-panel button.active { outline: 2px solid #fff5d6; }
      #poc-panel label { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
      #poc-panel input[type="range"] { width: 100%; }
      #poc-panel select { width: 100%; font: inherit; }
      #poc-stats { margin-top: 6px; color: #a9b982; }
      #poc-hint {
        position: fixed; z-index: 2; left: 12px; bottom: 12px;
        color: rgba(244,239,227,.85); background: rgba(20,27,17,.7);
        padding: 6px 9px; border-radius: 6px; font: 12px system-ui, sans-serif;
      }
      body.capture #poc-panel, body.capture #poc-hint { display: none; }
    </style>
  </head>
  <body>
    <canvas id="poc"></canvas>
    <aside id="poc-panel" aria-label="Frame PoC controls">
      <h1>FRAME POC — OLD vs NEW</h1>
      <div class="row">
        <button id="poc-old" type="button">OLD</button>
        <button id="poc-new" type="button">NEW</button>
      </div>
      <label><input type="checkbox" id="poc-nearp" /> near-camera grass cut</label>
      <label><input type="checkbox" id="poc-corp" /> sightline corridor to dog</label>
      <label><input type="checkbox" id="poc-shad" /> tree shadows</label>
      <label><input type="checkbox" id="poc-clou" /> soft clouds (2 masses)</label>
      <label><input type="checkbox" id="poc-ken" /> authored props (Kenney CC0)</label>
      <label>grass density <span id="poc-densv"></span><input type="range" id="poc-dens" min="0.25" max="1.5" step="0.05" /></label>
      <label>gun scale <span id="poc-gunv"></span><input type="range" id="poc-gun" min="0.7" max="1.3" step="0.05" /></label>
      <label>light <select id="poc-tod">
        <option value="dawn">dawn</option>
        <option value="morning">morning</option>
        <option value="noon">noon</option>
        <option value="evening">evening</option>
        <option value="lastlight">lastlight</option>
      </select></label>
      <div class="row"><button id="poc-recut" class="ghost" type="button">re-cut grass (C)</button></div>
      <div id="poc-stats">—</div>
    </aside>
    <div id="poc-hint">drag look · WASD move · C re-cut grass</div>
    <script type="module" src="/src/three/framePoc.ts"></script>
  </body>
</html>
