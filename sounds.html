<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uplandin sound board</title>
    <style>
      :root { color-scheme: light; --ink: #2b2a22; --muted: #6b6656; --paper: #efe8d6; --card: #f8f3e6; --line: #d8cfb8; --accent: #8a4b22; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
      h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: .01em; }
      .lede { color: var(--muted); margin: 0 0 22px; max-width: 70ch; }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; margin: 0 0 16px; }
      h2 { font-size: 17px; margin: 0 0 2px; }
      .note { color: var(--muted); margin: 0 0 12px; font-size: 13.5px; }
      table { border-collapse: collapse; width: 100%; }
      th { text-align: left; font-weight: 600; font-size: 13px; color: var(--muted); padding: 4px 6px; }
      td { padding: 4px 6px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0; }
      .row > span { min-width: 220px; font-weight: 600; font-size: 14px; }
      button { font: inherit; font-size: 13.5px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 7px;
        padding: 6px 11px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button:active, button.playing { background: var(--accent); border-color: var(--accent); color: #fff; }
      .scroll { overflow-x: auto; }
    </style>
  </head>
  <body>
    <main id="board">
      <h1>Uplandin sound board</h1>
      <p class="lede">Every sound the game synthesizes, played through the game's own mix: the limiter, and the field dipping under the report.
        Listen on the speakers or headphones you play on. Run <code>npm run dev</code> and open <code>/sounds.html</code>.</p>
    </main>
    <script type="module" src="/src/soundBoard.ts"></script>
  </body>
</html>
